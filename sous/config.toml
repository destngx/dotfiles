# Machine config for sous (CONTRACTS.md section 7.1 in the monorepo's docs/sous). Home-manager links
# a read-only copy to ~/.config/sous/config.toml. Agents never edit it.

[engine]
port = 9494
machine = ""              # empty means the short host name
first_mate = "ezmacmini"  # the always-on machine that runs the one first mate

[timing]
stale_seconds = 240
heartbeat_seconds = 600
relaunch_per_hour = 3
restart_idle_wait_seconds = 300
block_budget = 3

[workers]
per_project = 2
permission_mode = "auto"  # Claude Code decides each tool call, so unattended workers never stop at a prompt

[workers.projects]
monorepo = 2

[models]
first_mate = "opus"
mate = "opus"
intake = "haiku"
worker = "sonnet"
reviewer = "opus"

[paths]
projects = "~/projects"

# "auto" decides on its own and writes each choice to the decision log; "wait" parks every decision
# for you. A profile not listed here waits.
[profiles]
code = "auto"
knowledge = "auto"
