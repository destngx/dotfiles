# Machine config for sous (CONTRACTS.md section 7.1 in the monorepo's docs/sous). Home-manager links
# a read-only copy to ~/.config/sous/config.toml. Agents never edit it.

[engine]
port = 9696
machine = ""                  # empty means the Tailscale name, else the host name
first_mate = "ez2s-mac-mini"  # whose first mate leads from milestone 2; every Mac runs its own until then

[timing]
stale_seconds = 240
heartbeat_seconds = 600
relaunch_per_hour = 3
restart_idle_wait_seconds = 300
block_budget = 3

[workers]
per_project = 5
permission_mode = "auto"  # Claude Code decides each tool call, so unattended workers never stop at a prompt

[workers.projects]

[models]
first_mate = "opus"
mate = "opus"
intake = "haiku"
ship = "opus"
investigate = "sonnet"
reviewer = "opus"

[effort]
first_mate = "high"
ship = "high"
investigate = "medium"
reviewer = "high"

[paths]
projects = "~/projects"

# "auto" decides on its own and writes each choice to the decision log; "wait" parks every decision
# for you. A profile not listed here waits.
[profiles]
code = "auto"
knowledge = "auto"
