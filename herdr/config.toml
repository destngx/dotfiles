onboarding = false
[keys]
prefix = "ctrl+a"
new_workspace = "prefix+c"
new_tab = "cmd+t"
navigate_workspace_down = "j"
navigate_workspace_up = "k"

settings = "prefix+,"
reload_config = "prefix+r"
goto = "prefix+s"
next_tab = "prefix+ctrl+l"
previous_tab = "prefix+ctrl+h"
split_vertical = "prefix+-"
split_horizontal = "prefix+_"
close_pane = "prefix+x"
zoom = "prefix+z"
cycle_pane_next = "prefix+space"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

[terminal]
kitty_graphics = true

[ui]
prompt_new_tab_name = false
tab_bar_position = "top"
status_indicators = "symbols"
pane_gaps = false
window_title = "{terminal_title}"
accent = "#7e9cd8"

[ui.toast]
delivery = "system"

[theme]
name = "kanagawa"
